name: Bug report
description: Something in the app, a package, or a test does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, do not file it here: follow SECURITY.md and use the Security tab's private reporting form instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: 'Numbered and specific. For two phones, say which phone does each step, for example "Phone A: tap Add friend."'
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options:
        - App on an iPhone
        - App in the iOS Simulator
        - Package tests (Tools/test-all.sh)
        - Tools/Simulator or Tools/Peer
        - Docs
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build configuration
      options:
        - Debug
        - Release
        - Not applicable
  - type: input
    id: devices
    attributes:
      label: Devices and OS versions
      description: iPhone models and iOS versions, or the Mac, macOS, and Xcode versions. Say whether Apple Intelligence is on.
      placeholder: "Phone A: iPhone 16 Pro, iOS 27.0, Apple Intelligence on"
  - type: dropdown
    id: phones
    attributes:
      label: Phones involved
      options:
        - One
        - Two or more
        - None
  - type: textarea
    id: logs
    attributes:
      label: Logs or test output
      description: The failing test's output, or the Debug pairing log from You > Developer. Remove anything personal first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed names, places, and other personal details from the steps and logs.
          required: true
