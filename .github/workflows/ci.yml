name: CI

# Pull requests, and pushes to main. The steps match Tools/local-gate.sh, which
# runs the same checks locally when Actions is unavailable (ADR 0007).
on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the jobs only check out and build, and a pull request from
# a fork must not get write access.
permissions:
  contents: read

# A new push to a pull request supersedes its older run. Every run on main
# finishes, so each merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: Package tests (Xcode 27)
    # Only this preview image has the iOS 27 SDK (ADR 0007).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test all packages (warnings as errors)
        run: Tools/test-all.sh

  app:
    name: App build (iOS 27 Simulator)
    needs: packages
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec App/project.yml
      - name: Build
        run: >
          xcodebuild build
          -project App/Starling.xcodeproj
          -scheme Starling
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Release links no StarlingFakes (ADR 0140)
        run: Tools/check-release-no-fakes.sh
      - name: Release has no Developer section (ADR 0015)
        run: Tools/check-release-no-debug.sh
