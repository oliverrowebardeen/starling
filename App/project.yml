# XcodeGen spec (ADR 0005). Generate with: xcodegen generate --spec App/project.yml
# The generated App/Starling.xcodeproj is gitignored; never edit it by hand.
name: Starling
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StarlingCore:
    path: ../Packages/StarlingCore
  StarlingTransport:
    path: ../Packages/StarlingTransport
  StarlingAgent:
    path: ../Packages/StarlingAgent
  # The app's view models and presentation logic (lane P15-A), tested with
  # `swift test`.
  StarlingFeatures:
    path: Features
  # Lane G's deterministic policy, consent sheet model, and audit log.
  StarlingPolicy:
    path: ../Packages/StarlingPolicy
  # Lane E1's identity, pinned friends, pairing, and secure channel.
  StarlingIdentity:
    path: ../Packages/StarlingIdentity
  # Lane B's Down for..., lane C's Find a time and calendar access, lane D's
  # Pick a place, lane E's chaining and audit, and its Swap photos.
  ChangePlan:
    path: ../Packages/Skills/ChangePlan
  DownFor:
    path: ../Packages/Skills/DownFor
  FindATime:
    path: ../Packages/Skills/FindATime
  PickAPlace:
    path: ../Packages/Skills/PickAPlace
  StarlingAvailability:
    path: ../Packages/StarlingAvailability
  StarlingChaining:
    path: ../Packages/StarlingChaining
  SwapPhotos:
    path: ../Packages/Skills/SwapPhotos
  # Lane BR's status mark and palette (ADR 0172).
  StarlingDesign:
    path: ../Packages/StarlingDesign
targets:
  Starling:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Icon Composer bundle (ADR 0170). Explicit type and phase because
      # XcodeGen only recognizes .icon on its own from 2.45.1.
      - path: Resources/Starling.icon
        type: file
        buildPhase: resources
    # Wi-Fi Aware entitlement (ADR 0111). XcodeGen writes the file from
    # `properties`. The App ID needs the Wi-Fi Aware capability enabled in
    # the developer portal before a signed device build.
    entitlements:
      path: Config/Starling.entitlements
      properties:
        com.apple.developer.wifi-aware: [Publish, Subscribe]
    # The bundle identifier comes from Config/Starling.xcconfig, which a
    # developer overrides in the gitignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Starling.xcconfig
      Release: Config/Starling.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Starling
        ASSETCATALOG_COMPILER_APPICON_NAME: Starling
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          # Keeps StarlingFakes (scripted doubles, the insecure PSI stub) out
          # of the Release link. `#if DEBUG` alone is not enough: the linker
          # keeps unreferenced Swift conformance records. A Release reference
          # to a fake now fails to link (ADR 0140).
          EXCLUDED_SOURCE_FILE_NAMES: StarlingFakes.o
    dependencies:
      - package: StarlingCore
        product: StarlingCore
      # Fakes for lanes that have not merged (the skills until lanes B to E
      # land). Every import sits inside `#if DEBUG`, so Release builds do
      # not link them (ADR 0140).
      - package: StarlingCore
        product: StarlingFakes
      - package: StarlingFeatures
        product: StarlingFeatures
      - package: StarlingDesign
        product: StarlingDesign
      - package: ChangePlan
        product: StarlingChangePlan
      - package: DownFor
        product: DownFor
      - package: FindATime
        product: FindATime
      - package: StarlingAvailability
        product: StarlingAvailability
      - package: PickAPlace
        product: PickAPlace
      - package: PickAPlace
        product: PickAPlaceMapKit
      - package: StarlingChaining
        product: StarlingChaining
      - package: SwapPhotos
        product: StarlingSwapPhotos
      - package: StarlingPolicy
        product: StarlingPolicy
      - package: StarlingIdentity
        product: StarlingIdentity
      - package: StarlingTransport
        product: StarlingTransport
      - package: StarlingTransport
        product: StarlingLocalP2P
      - package: StarlingTransport
        product: StarlingWiFiAware
      - package: StarlingAgent
        product: StarlingAgent
      - package: StarlingAgent
        product: StarlingAgentBench
