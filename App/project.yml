# XcodeGen spec (ADR 0005). Generate with: xcodegen generate --spec App/project.yml
# The generated App/Starling.xcodeproj is gitignored; never edit it by hand.
name: Starling
options:
  bundleIdPrefix: com.oliverrowebardeen
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StarlingCore:
    path: ../Packages/StarlingCore
  StarlingTransport:
    path: ../Packages/StarlingTransport
  StarlingAgent:
    path: ../Packages/StarlingAgent
  # Lane H's view models and presentation logic, tested with `swift test`.
  StarlingFeatures:
    path: Features
  # Lane G's deterministic policy, consent sheet model, and audit log.
  StarlingPolicy:
    path: ../Packages/StarlingPolicy
  # Lane BR's status mark and palette (ADR 0172).
  StarlingDesign:
    path: ../Packages/StarlingDesign
targets:
  Starling:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Icon Composer bundle (ADR 0170). Explicit type and phase because
      # XcodeGen only recognizes .icon on its own from 2.45.1.
      - path: Resources/Starling.icon
        type: file
        buildPhase: resources
    # Wi-Fi Aware entitlement (ADR 0111). XcodeGen writes the file from
    # `properties`. The App ID needs the Wi-Fi Aware capability enabled in
    # the developer portal before a signed device build.
    entitlements:
      path: Config/Starling.entitlements
      properties:
        com.apple.developer.wifi-aware: [Publish, Subscribe]
    configFiles:
      Debug: Config/Starling.xcconfig
      Release: Config/Starling.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverrowebardeen.starling
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Starling
        ASSETCATALOG_COMPILER_APPICON_NAME: Starling
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          # Keeps StarlingFakes (scripted doubles, the insecure PSI stub) out
          # of the Release link. `#if DEBUG` alone is not enough: the linker
          # keeps unreferenced Swift conformance records. A Release reference
          # to a fake now fails to link (ADR 0140).
          EXCLUDED_SOURCE_FILE_NAMES: StarlingFakes.o
    dependencies:
      - package: StarlingCore
        product: StarlingCore
      # Fakes for lanes that have not merged. Every import sits inside
      # `#if DEBUG`, so Release builds do not link them (ADR 0140).
      - package: StarlingCore
        product: StarlingFakes
      - package: StarlingFeatures
        product: StarlingFeatures
      - package: StarlingDesign
        product: StarlingDesign
      - package: StarlingPolicy
        product: StarlingPolicy
      - package: StarlingTransport
        product: StarlingTransport
      - package: StarlingTransport
        product: StarlingLocalP2P
      - package: StarlingTransport
        product: StarlingWiFiAware
      - package: StarlingAgent
        product: StarlingAgent
      - package: StarlingAgent
        product: StarlingAgentBench
